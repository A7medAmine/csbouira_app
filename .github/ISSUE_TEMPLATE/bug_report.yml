name: Bug report
description: Something in the app doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! For **security issues**, please don't use this form; see SECURITY.md.
        For a missing or wrong course file, use the in-app Upload screen instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Licence 2 → S03 → ...
        2. Tap ...
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Profile → About shows the version.
      placeholder: 1.0.2
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Samsung Galaxy S10, Android 12
  - type: dropdown
    id: language
    attributes:
      label: App language
      options: [العربية, Français, English]
  - type: dropdown
    id: account
    attributes:
      label: Were you signed in?
      options: [Guest, Email account, Google account]
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Optional. Please remove any personal information.
